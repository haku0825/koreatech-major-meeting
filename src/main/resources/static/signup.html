<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOREATECH 회원가입</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css");

    :root {
      --bg: #f2f7fb;
      --ink: #0f2431;
      --muted: #4e6574;
      --line: #cbdae4;
      --panel: #ffffff;
      --brand: #00588a;
      --brand-2: #007f9f;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow: 0 16px 36px rgba(3, 38, 58, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      font-family: "SUIT", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, #d8ecff 0%, transparent 35%),
        radial-gradient(circle at 88% 14%, #d7f0e8 0%, transparent 38%),
        var(--bg);
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .top {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
    }

    .top p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #c4d3dc;
      border-radius: var(--radius-sm);
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    button {
      border: none;
      border-radius: var(--radius-sm);
      min-height: 42px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(100deg, var(--brand), var(--brand-2));
    }

    button.ghost { background: #36495a; }

    .content {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .card {
      border: 1px solid #c9d9e2;
      border-radius: var(--radius-md);
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .card h2 {
      margin: 0;
      font-size: 19px;
    }

    .card p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
  <link rel="stylesheet" href="/assets/kmm-theme.css" />
</head>
<body class="page-account">
<div class="app">
  <header class="panel top">
    <div>
      <h1>회원가입</h1>
      <p>신규 계정 생성 후, 계정 페이지에서 인증을 진행하세요.</p>
    </div>
    <div class="buttons">
      <button class="ghost" onclick="window.location.assign('/')">홈으로</button>
      <button class="ghost" onclick="window.location.assign('/account.html')">계정으로</button>
    </div>
  </header>

  <main class="panel content">
    <section class="card">
      <h2>가입 정보 입력</h2>
      <p>학교 이메일은 반드시 <code>@koreatech.ac.kr</code> 도메인이어야 합니다.</p>
      <input id="signupEmail" placeholder="이메일" />
      <input id="signupPassword" type="password" placeholder="비밀번호" />
      <input id="signupPasswordConfirm" type="password" placeholder="비밀번호 확인" />
      <input id="signupName" placeholder="실명" />
      <input id="signupNickname" placeholder="닉네임" />
      <input id="signupBirthYear" placeholder="출생연도 (예: 2002)" />
      <input id="signupStudentNumber" placeholder="학번 (숫자 10자리)" />
      <select id="signupMajor"></select>
      <button id="signupBtn">회원가입 완료</button>
    </section>
  </main>
</div>

<script>
  const MAJORS = [
    { value: "MECHANICAL", label: "기계공학부" },
    { value: "MECHATRONICS", label: "메카트로닉스공학부" },
    { value: "ELECTRICAL_ELECTRONICS_COMMUNICATION", label: "전기·전자·통신공학부" },
    { value: "COMPUTER_SCIENCE", label: "컴퓨터공학부" },
    { value: "DESIGN", label: "디자인공학부" },
    { value: "ENERGY_MATERIALS_CHEMICAL", label: "에너지신소재화학공학부" },
    { value: "INDUSTRIAL_MANAGEMENT", label: "산업경영학부" },
    { value: "EMPLOYMENT_SERVICES", label: "고용서비스정책학과" }
  ];

  const $ = (id) => document.getElementById(id);

  function fillMajorSelect(selectEl, selectedValue) {
    selectEl.innerHTML = MAJORS.map((major) => {
      const selected = selectedValue === major.value ? "selected" : "";
      return `<option value="${major.value}" ${selected}>${major.label}</option>`;
    }).join("");
  }

  function normalizeErrorPayload(status, payload, rawText) {
    if (payload && payload.error) {
      return {
        status,
        code: payload.error.code || "UNKNOWN",
        message: payload.error.message || "요청 실패"
      };
    }
    return {
      status,
      code: "HTTP_" + status,
      message: rawText || "요청 실패"
    };
  }

  async function api(path, options = {}) {
    const method = options.method || "GET";
    const requestOptions = {
      method,
      credentials: "same-origin",
      headers: options.headers ? { ...options.headers } : {}
    };

    if (options.body !== undefined && options.body !== null) {
      requestOptions.headers["Content-Type"] = "application/json";
      requestOptions.body = JSON.stringify(options.body);
    }

    const response = await fetch(path, requestOptions);
    const rawText = await response.text();
    let payload = null;

    if (rawText) {
      try {
        payload = JSON.parse(rawText);
      } catch (_) {
        payload = null;
      }
    }

    if (!response.ok) {
      throw normalizeErrorPayload(response.status, payload, rawText);
    }

    if (!payload) return null;
    if (payload.success === false) {
      throw normalizeErrorPayload(response.status, payload, rawText);
    }
    return payload.data;
  }

  async function signup() {
    const password = $("signupPassword").value;
    const passwordConfirm = $("signupPasswordConfirm").value;
    const nickname = $("signupNickname").value.trim();
    const birthYear = $("signupBirthYear").value.trim();
    const studentNumber = $("signupStudentNumber").value.trim();

    if (password !== passwordConfirm) {
      alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
      return;
    }

    if (!/^\d{10}$/.test(studentNumber)) {
      alert("학번은 숫자 10자리로 입력해주세요.");
      return;
    }

    if (!/^\d{4}$/.test(birthYear)) {
      alert("출생연도는 숫자 4자리로 입력해주세요.");
      return;
    }

    if (!nickname) {
      alert("닉네임을 입력해주세요.");
      return;
    }

    try {
      await api("/api/v1/auth/signup", {
        method: "POST",
        body: {
          email: $("signupEmail").value.trim(),
          password,
          passwordConfirm,
          name: $("signupName").value.trim(),
          nickname,
          birthYear,
          studentNumber,
          major: $("signupMajor").value
        }
      });

      alert("회원가입 완료. 계정 페이지에서 로그인 후 인증을 진행하세요.");
      window.location.assign("/account.html");
    } catch (error) {
      alert(`회원가입 실패: ${error.message}`);
    }
  }

  fillMajorSelect($("signupMajor"), "COMPUTER_SCIENCE");
  $("signupBtn").addEventListener("click", signup);
</script>
</body>
</html>
