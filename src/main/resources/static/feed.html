<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOREATECH 매칭보드</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css");

    :root {
      --bg: #f2f7fb;
      --ink: #0f2431;
      --muted: #4e6574;
      --line: #cbdae4;
      --panel: #ffffff;
      --brand: #00588a;
      --brand-2: #007f9f;
      --ok: #0f8d5f;
      --bad: #ac2d2d;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow: 0 16px 36px rgba(3, 38, 58, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      font-family: "SUIT", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, #d8ecff 0%, transparent 35%),
        radial-gradient(circle at 88% 14%, #d7f0e8 0%, transparent 38%),
        var(--bg);
    }

    body.gate-pending .app {
      visibility: hidden;
    }

    .app {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .top {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .top-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
    }

    .top p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .login-box {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .hidden { display: none !important; }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid #c5d5de;
      background: #f6fbff;
      color: #365061;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
    }

    .chip.ok { border-color: #84debd; background: #ecfff7; color: var(--ok); }
    .chip.bad { border-color: #edb0b0; background: #fff3f3; color: var(--bad); }

    input, select, textarea, button { font: inherit; }

    input, select, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid #c4d3dc;
      border-radius: var(--radius-sm);
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0, 88, 138, 0.12);
    }

    button {
      border: none;
      border-radius: var(--radius-sm);
      min-height: 42px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(100deg, var(--brand), var(--brand-2));
    }

    button.ghost { background: #36495a; }
    button.danger { background: #ba2d2d; }

    .feed {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .section-head p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .section-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .feed-list {
      display: grid;
      gap: 10px;
      min-height: 280px;
      max-height: min(74dvh, 760px);
      overflow: auto;
      padding-right: 3px;
    }

    .post-card {
      border: 1px solid #cad9e2;
      border-radius: var(--radius-md);
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 9px;
    }

    .post-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .post-intro {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-size: 14px;
    }

    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .member-tag {
      border: 1px solid #c4d6df;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      color: #325062;
      background: #f3faff;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .post-actions button {
      min-height: 34px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .empty {
      border: 1px dashed #c2d3dc;
      border-radius: var(--radius-md);
      background: #f8fcff;
      color: #4f6978;
      text-align: center;
      padding: 14px;
      font-size: 13px;
    }

    .auth-required-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(7, 24, 36, 0.58);
      z-index: 1300;
    }

    .auth-required-modal.open { display: flex; }

    .auth-required-card {
      width: min(420px, 100%);
      border: 1px solid #c3d4dd;
      border-radius: 16px;
      background: #fff;
      padding: 16px;
      display: grid;
      gap: 10px;
      text-align: center;
    }

    .auth-required-card h3 {
      margin: 0;
      font-size: 20px;
    }

    .auth-required-card p {
      margin: 0;
      color: #496272;
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(6, 22, 33, 0.54);
      z-index: 999;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(700px, 100%);
      max-height: 90dvh;
      overflow: auto;
      border: 1px solid #c3d4dd;
      border-radius: 18px;
      background: #fff;
      padding: 14px;
      display: grid;
      gap: 9px;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.22);
    }

    .member-rows {
      display: grid;
      gap: 8px;
    }

    .member-row {
      border: 1px solid #cfdbe2;
      border-radius: 12px;
      background: #f8fcff;
      padding: 8px;
      display: grid;
      grid-template-columns: 90px 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .member-row b {
      font-size: 12px;
      color: #335263;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 760px) {
      .login-box { grid-template-columns: 1fr; }
      .section-head { flex-direction: column; align-items: flex-start; }
      .member-row { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/assets/kmm-theme.css" />
</head>
<body class="page-feed gate-pending">
<div class="app">
  <header class="panel top">
    <div class="top-head">
      <div>
        <h1>매칭보드</h1>
        <p>매칭 글 작성/조회/수정/삭제와 쪽지 시작 기능만 제공합니다.</p>
      </div>
      <button class="ghost" onclick="window.location.assign('/')">홈으로</button>
    </div>

    <div class="status-row">
      <span id="profileChip" class="chip">내 정보: -</span>
    </div>
  </header>

  <main class="panel feed">
    <div class="section-head">
      <div>
        <h2>모집글 목록</h2>
        <p>다른 팀 모집글에는 쪽지를 보내고, 내 모집글은 수정/삭제할 수 있습니다.</p>
      </div>
      <div class="section-actions">
        <button id="newPostBtn">새 모집글</button>
        <button id="refreshPostBtn" class="ghost">새로고침</button>
      </div>
    </div>
    <div id="postFeed" class="feed-list"></div>
  </main>
</div>

<div id="authRequiredModal" class="auth-required-modal">
  <div class="auth-required-card">
    <h3>로그인이 필요합니다!</h3>
    <p>이 페이지는 로그인 후 이용할 수 있습니다.</p>
    <button id="goHomeFromAuthModalBtn" class="ghost">홈 화면 가기</button>
  </div>
</div>

<div id="verificationRequiredModal" class="auth-required-modal">
  <div class="auth-required-card">
    <h3>추가 인증이 필요합니다</h3>
    <p>이메일 인증과 학생증 인증이 완료되어야 이 페이지를 이용할 수 있습니다.</p>
    <div class="modal-actions" style="justify-content:center;">
      <button id="goAccountFromVerificationModalBtn">계정 페이지로 가기</button>
      <button id="goHomeFromVerificationModalBtn" class="ghost">홈 화면 가기</button>
    </div>
  </div>
</div>

<div id="postModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="postModalTitle">새 모집글 작성</h3>
    <input id="postEditId" type="hidden" />

    <label>총 인원</label>
    <input id="postMemberCount" type="number" min="1" max="10" value="2" />

    <label>소개글</label>
    <textarea id="postIntroduction" rows="4" placeholder="예: 남2, 컴공, 분위기 좋은 과팅 원해요."></textarea>

    <label>멤버 정보 (학과 + 학번, 작성자 본인 포함 필수)</label>
    <div id="postMemberRows" class="member-rows"></div>

    <div class="modal-actions">
      <button id="cancelPostModalBtn" class="ghost">취소</button>
      <button id="savePostBtn">저장</button>
    </div>
  </div>
</div>

<script>
  const MAJORS = [
    { value: "MECHANICAL", label: "기계공학부" },
    { value: "MECHATRONICS", label: "메카트로닉스공학부" },
    { value: "ELECTRICAL_ELECTRONICS_COMMUNICATION", label: "전기·전자·통신공학부" },
    { value: "COMPUTER_SCIENCE", label: "컴퓨터공학부" },
    { value: "DESIGN", label: "디자인공학부" },
    { value: "ENERGY_MATERIALS_CHEMICAL", label: "에너지신소재화학공학부" },
    { value: "INDUSTRIAL_MANAGEMENT", label: "산업경영학부" },
    { value: "EMPLOYMENT_SERVICES", label: "고용서비스정책학과" }
  ];

  const state = {
    me: null,
    posts: []
  };

  const $ = (id) => document.getElementById(id);

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function formatDateTime(input) {
    if (!input) return "-";
    const date = new Date(input);
    if (Number.isNaN(date.getTime())) return input;
    return date.toLocaleString("ko-KR", { hour12: false });
  }

  function majorLabel(major) {
    const found = MAJORS.find((item) => item.value === major);
    return found ? found.label : (major || "-");
  }

  function classYearLabel(studentNumber) {
    const value = String(studentNumber || "").trim();
    if (value.length < 4) return "-학번";
    const firstFour = value.slice(0, 4);
    if (!/^\d{4}$/.test(firstFour)) return "-학번";
    return `${firstFour.slice(2)}학번`;
  }

  function normalizeErrorPayload(status, payload, rawText) {
    if (payload && payload.error) {
      return {
        status,
        code: payload.error.code || "UNKNOWN",
        message: payload.error.message || "요청 실패"
      };
    }
    return {
      status,
      code: "HTTP_" + status,
      message: rawText || "요청 실패"
    };
  }

  async function api(path, options = {}) {
    const method = options.method || "GET";
    const requestOptions = {
      method,
      cache: "no-store",
      credentials: "same-origin",
      headers: options.headers ? { ...options.headers } : {}
    };

    if (options.body !== undefined && options.body !== null) {
      requestOptions.headers["Content-Type"] = "application/json";
      requestOptions.body = JSON.stringify(options.body);
    }

    const response = await fetch(path, requestOptions);
    const rawText = await response.text();
    let payload = null;

    if (rawText) {
      try {
        payload = JSON.parse(rawText);
      } catch (_) {
        payload = null;
      }
    }

    if (!response.ok) {
      throw normalizeErrorPayload(response.status, payload, rawText);
    }

    if (!payload) return null;
    if (payload.success === false) {
      throw normalizeErrorPayload(response.status, payload, rawText);
    }
    return payload.data;
  }

  function refreshHeader() {
    const profileChip = $("profileChip");

    if (!state.me) {
      profileChip.textContent = "내 정보: -";
      return;
    }

    const yearLabel = state.me.birthYear ? `${String(state.me.birthYear).slice(-2)}년생` : "-년생";
    profileChip.textContent = `${state.me.nickname || state.me.name} | ${majorLabel(state.me.major)} | ${yearLabel}`;
  }

  function showAuthRequiredModal() {
    $("authRequiredModal").classList.add("open");
  }

  function showVerificationRequiredModal() {
    $("verificationRequiredModal").classList.add("open");
  }

  function unlockPage() {
    document.body.classList.remove("gate-pending");
  }

  function isFullyVerifiedUser(user) {
    return !!(user && user.emailVerified && user.studentCardVerified);
  }

  function renderPostList() {
    const feed = $("postFeed");

    if (!state.me) {
      feed.innerHTML = `<div class="empty">로그인 후 모집글 목록을 조회할 수 있습니다.</div>`;
      return;
    }

    if (!state.posts.length) {
      feed.innerHTML = `<div class="empty">아직 모집글이 없습니다. 첫 모집글을 올려보세요.</div>`;
      return;
    }

    feed.innerHTML = state.posts.map((post) => {
      const mine = post.writerUserId === state.me.userId;
      const sameTeamPost = !mine && !!post.viewerIsTeamMember;
      const alreadyChatting = !mine && !!post.viewerHasOpenChatRoom;

      const memberTags = (post.memberProfiles || []).map((member) => {
        const yearLabel = member.birthYear ? `${String(member.birthYear).slice(-2)}년생` : "-년생";
        const classYear = classYearLabel(member.studentNumber);
        return `<span class="member-tag">${majorLabel(member.major)} · ${classYear} · ${yearLabel}</span>`;
      }).join("");

      let actionButtons = "";
      if (mine) {
        actionButtons = `
          <button onclick="openPostModalForEdit(${post.postId})" class="ghost">수정</button>
          <button onclick="deletePost(${post.postId})" class="danger">삭제</button>
        `;
      } else if (sameTeamPost) {
        actionButtons = `<span class="member-tag">내가 포함된 팀 포스트</span>`;
      } else if (alreadyChatting) {
        actionButtons = `<span class="member-tag">이미 쪽지 진행 중</span>`;
      } else {
        actionButtons = `<button onclick="openChatPageFromPost(${post.postId})">쪽지 보내기</button>`;
      }

      return `
        <article class="post-card">
          <div class="post-meta">
            <span>글 #${post.postId} · 작성자 #${post.writerUserId}</span>
            <span>${formatDateTime(post.createdAt)}</span>
          </div>
          <p class="post-intro">${escapeHtml(post.introduction)}</p>
          <div class="member-list">${memberTags}</div>
          <div class="post-actions">${actionButtons}</div>
        </article>
      `;
    }).join("");
  }

  function resetPostModal() {
    $("postEditId").value = "";
    $("postMemberCount").value = 2;
    $("postIntroduction").value = "";
    $("postModalTitle").textContent = "새 모집글 작성";
    renderPostMemberRows(2, defaultCreateMembers(2));
  }

  function defaultCreateMembers(count) {
    const members = Array.from({ length: count }, () => ({}));
    if (state.me) {
      members[0] = {
        major: state.me.major,
        studentNumber: state.me.studentNumber
      };
    }
    return members;
  }

  function renderPostMemberRows(count, members) {
    const rows = $("postMemberRows");
    rows.innerHTML = "";

    for (let i = 0; i < count; i += 1) {
      const preset = members[i] || {};
      const row = document.createElement("div");
      row.className = "member-row";
      row.innerHTML = `
        <b>${i + 1}번 멤버</b>
        <select class="member-major" data-index="${i}">
          ${MAJORS.map((major) => {
            const selected = preset.major === major.value || (!preset.major && major.value === "COMPUTER_SCIENCE") ? "selected" : "";
            return `<option value="${major.value}" ${selected}>${major.label}</option>`;
          }).join("")}
        </select>
        <input class="member-student" data-index="${i}" placeholder="학번" value="${escapeHtml(preset.studentNumber || "")}" />
      `;
      rows.appendChild(row);
    }
  }

  async function openPostModalForCreate() {
    if (!state.me) {
      showAuthRequiredModal();
      return;
    }

    try {
      const active = await api("/api/v1/posts/me/active");
      if (active && active.hasActivePost) {
        const statusLabel = active.status === "IN_CHAT" ? "쪽지 진행 중" : "모집 중";
        alert(`이미 활성 모집글이 있습니다. (포스트 #${active.postId}, ${statusLabel})`);
        return;
      }
    } catch (error) {
      alert(`활성 모집글 확인 실패: ${error.message}`);
      return;
    }

    resetPostModal();
    $("postModalBackdrop").classList.add("open");
  }

  function openPostModalForEdit(postId) {
    const post = state.posts.find((item) => item.postId === postId);
    if (!post) {
      alert("수정할 포스트를 찾을 수 없습니다.");
      return;
    }

    $("postEditId").value = String(post.postId);
    $("postMemberCount").value = String(post.totalMemberCount);
    $("postIntroduction").value = post.introduction || "";
    $("postModalTitle").textContent = `포스트 #${post.postId} 수정`;
    renderPostMemberRows(post.totalMemberCount, post.memberProfiles || []);
    $("postModalBackdrop").classList.add("open");
  }

  function closePostModal() {
    $("postModalBackdrop").classList.remove("open");
  }

  function collectPostMembers() {
    const majors = Array.from(document.querySelectorAll("#postMemberRows .member-major"));
    const students = Array.from(document.querySelectorAll("#postMemberRows .member-student"));

    return majors.map((majorSelect, idx) => {
      return {
        major: majorSelect.value,
        studentNumber: (students[idx].value || "").trim()
      };
    });
  }

  async function loadMe() {
    try {
      const me = await api("/api/v1/users/me");
      state.me = me;
      refreshHeader();
      return { ok: true, error: null };
    } catch (error) {
      state.me = null;
      refreshHeader();
      return { ok: false, error };
    }
  }

  async function loadPosts() {
    if (!state.me) {
      state.posts = [];
      renderPostList();
      return;
    }

    try {
      const data = await api("/api/v1/posts?page=0&size=40");
      state.posts = data.posts || [];
      renderPostList();
    } catch (error) {
      state.posts = [];
      renderPostList();
      alert(`포스트 목록 조회 실패: ${error.message}`);
    }
  }

  async function savePost() {
    if (!state.me) {
      alert("로그인 후 작성할 수 있습니다.");
      return;
    }

    const postId = $("postEditId").value;
    const totalMemberCount = Number($("postMemberCount").value || 0);
    const introduction = $("postIntroduction").value.trim();
    const memberProfiles = collectPostMembers();

    const payload = {
      totalMemberCount,
      introduction,
      memberProfiles
    };

    try {
      if (postId) {
        await api(`/api/v1/posts/${postId}`, { method: "PUT", body: payload });
      } else {
        await api("/api/v1/posts", { method: "POST", body: payload });
      }
      closePostModal();
      await loadPosts();
    } catch (error) {
      alert(`포스트 저장 실패: ${error.message}`);
    }
  }

  async function deletePost(postId) {
    const ok = confirm(`포스트 #${postId} 를 삭제할까요?`);
    if (!ok) {
      return;
    }

    try {
      await api(`/api/v1/posts/${postId}`, { method: "DELETE" });
      await loadPosts();
    } catch (error) {
      alert(`포스트 삭제 실패: ${error.message}`);
    }
  }

  function openChatPageFromPost(postId) {
    if (!state.me) {
      showAuthRequiredModal();
      return;
    }
    window.location.assign(`/chat-room.html?postId=${encodeURIComponent(postId)}`);
  }

  async function bootstrap() {
    refreshHeader();
    renderPostList();

    const meResult = await loadMe();
    if (!meResult.ok) {
      showAuthRequiredModal();
      return;
    }

    if (!isFullyVerifiedUser(state.me)) {
      showVerificationRequiredModal();
      return;
    }

    unlockPage();
    await loadPosts();
  }

  $("goHomeFromAuthModalBtn").addEventListener("click", () => window.location.assign("/"));
  $("goAccountFromVerificationModalBtn").addEventListener("click", () => window.location.assign("/account.html"));
  $("goHomeFromVerificationModalBtn").addEventListener("click", () => window.location.assign("/"));
  $("newPostBtn").addEventListener("click", openPostModalForCreate);
  $("refreshPostBtn").addEventListener("click", loadPosts);
  $("savePostBtn").addEventListener("click", savePost);
  $("cancelPostModalBtn").addEventListener("click", closePostModal);
  $("postMemberCount").addEventListener("change", () => {
    const value = Math.min(Math.max(Number($("postMemberCount").value || 1), 1), 10);
    $("postMemberCount").value = String(value);
    if ($("postEditId").value) {
      renderPostMemberRows(value, []);
      return;
    }
    renderPostMemberRows(value, defaultCreateMembers(value));
  });

  window.openPostModalForEdit = openPostModalForEdit;
  window.deletePost = deletePost;
  window.openChatPageFromPost = openChatPageFromPost;

  bootstrap();
</script>
</body>
</html>
