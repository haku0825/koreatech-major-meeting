<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOREATECH 쪽지함</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css");

    :root {
      --bg: #f3f8fc;
      --ink: #112a39;
      --muted: #4b6677;
      --line: #c8d9e3;
      --panel: #ffffff;
      --brand: #005a8b;
      --brand-2: #00879f;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;
      --shadow: 0 14px 34px rgba(2, 40, 60, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      font-family: "SUIT", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, #d9edff 0%, transparent 35%),
        radial-gradient(circle at 86% 14%, #d8f1ea 0%, transparent 38%),
        var(--bg);
    }

    body.gate-pending .app {
      visibility: hidden;
    }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .top {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .top-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .top h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.02em;
    }

    .top p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .login-box {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .hidden { display: none !important; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input, button { font: inherit; }

    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid #c2d4de;
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      background: #fff;
      outline: none;
      color: var(--ink);
    }

    button {
      border: none;
      border-radius: var(--radius-sm);
      min-height: 40px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(100deg, var(--brand), var(--brand-2));
    }

    button.ghost { background: #36495a; }

    .chip {
      border-radius: 999px;
      border: 1px solid #c3d4dd;
      background: #f5fbff;
      color: #355164;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
    }

    .chip.ok {
      border-color: #88dfbf;
      background: #edfff7;
      color: #177a56;
    }

    .chip.bad {
      border-color: #ebb2b2;
      background: #fff3f3;
      color: #a63131;
    }

    .box {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .head h2 {
      margin: 0;
      font-size: 19px;
    }

    .room-list {
      display: grid;
      gap: 8px;
      max-height: 68dvh;
      overflow: auto;
      padding-right: 2px;
    }

    .room-link {
      text-decoration: none;
      color: inherit;
    }

    .room-item {
      border: 1px solid #c8d9e2;
      border-radius: 11px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .room-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .room-name {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
    }

    .room-id {
      border: 1px solid #c4d6df;
      border-radius: 999px;
      background: #f6fcff;
      color: #516b79;
      font-size: 11px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .room-meta {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .room-pill {
      border: 1px solid #bfd5e1;
      border-radius: 999px;
      background: #eef8fd;
      color: #32586c;
      font-size: 11px;
      padding: 2px 8px;
    }

    .room-time {
      font-size: 11px;
      color: #68808c;
      white-space: nowrap;
    }

    .room-preview {
      margin: 0;
      color: #4f6675;
      font-size: 12px;
      line-height: 1.4;
      min-height: 30px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty {
      border: 1px dashed #c0d1db;
      border-radius: 11px;
      background: #f8fcff;
      color: #506b79;
      padding: 14px;
      text-align: center;
      font-size: 12px;
    }

    .auth-required-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(7, 24, 36, 0.58);
      z-index: 1300;
    }

    .auth-required-modal.open { display: flex; }

    .auth-required-card {
      width: min(420px, 100%);
      border: 1px solid #c3d4dd;
      border-radius: 16px;
      background: #fff;
      padding: 16px;
      display: grid;
      gap: 10px;
      text-align: center;
    }

    .auth-required-card h3 {
      margin: 0;
      font-size: 20px;
    }

    .auth-required-card p {
      margin: 0;
      color: #496272;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .login-box { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/assets/kmm-theme.css" />
</head>
<body class="page-chat-inbox gate-pending">
<div class="app">
  <header class="panel top">
    <div class="top-head">
      <div>
        <h1>쪽지함</h1>
        <p>내가 참여한 채팅방 목록을 확인하고, 방을 눌러 대화 페이지로 이동합니다.</p>
      </div>
      <button class="ghost" onclick="window.location.assign('/')">홈으로</button>
    </div>

    <div class="chip-row">
      <span id="profileChip" class="chip">내 정보: -</span>
    </div>
  </header>

  <main class="panel box">
    <div class="head">
      <h2>채팅방 목록</h2>
      <button id="refreshRoomBtn" class="ghost">새로고침</button>
    </div>
    <div id="roomList" class="room-list"></div>
  </main>
</div>

<div id="authRequiredModal" class="auth-required-modal">
  <div class="auth-required-card">
    <h3>로그인이 필요합니다!</h3>
    <p>이 페이지는 로그인 후 이용할 수 있습니다.</p>
    <button id="goHomeFromAuthModalBtn" class="ghost">홈 화면 가기</button>
  </div>
</div>

<div id="verificationRequiredModal" class="auth-required-modal">
  <div class="auth-required-card">
    <h3>추가 인증이 필요합니다</h3>
    <p>이메일 인증과 학생증 인증이 완료되어야 이 페이지를 이용할 수 있습니다.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <button id="goAccountFromVerificationModalBtn">계정 페이지로 가기</button>
      <button id="goHomeFromVerificationModalBtn" class="ghost">홈 화면 가기</button>
    </div>
  </div>
</div>

<script>
  const MAJOR_LABELS = {
    MECHANICAL: "기계공학부",
    MECHATRONICS: "메카트로닉스공학부",
    ELECTRICAL_ELECTRONICS_COMMUNICATION: "전기·전자·통신공학부",
    COMPUTER_SCIENCE: "컴퓨터공학부",
    DESIGN: "디자인공학부",
    ENERGY_MATERIALS_CHEMICAL: "에너지신소재화학공학부",
    INDUSTRIAL_MANAGEMENT: "산업경영학부",
    EMPLOYMENT_SERVICES: "고용서비스정책학과"
  };

  const state = {
    me: null,
    rooms: [],
    pollingId: null
  };

  const POLLING_INTERVAL_MS = 6000;
  const $ = (id) => document.getElementById(id);

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function formatDateTime(input) {
    if (!input) return "-";
    const date = new Date(input);
    if (Number.isNaN(date.getTime())) return input;
    return date.toLocaleString("ko-KR", { hour12: false });
  }

  function majorLabel(major) {
    return MAJOR_LABELS[major] || major || "-";
  }

  function normalizeErrorPayload(status, payload, rawText) {
    if (payload && payload.error) {
      return {
        status,
        code: payload.error.code || "UNKNOWN",
        message: payload.error.message || "요청 실패"
      };
    }
    return {
      status,
      code: "HTTP_" + status,
      message: rawText || "요청 실패"
    };
  }

  async function api(path, options = {}) {
    const method = options.method || "GET";
    const requestOptions = {
      method,
      cache: "no-store",
      credentials: "same-origin",
      headers: options.headers ? { ...options.headers } : {}
    };

    if (options.body !== undefined && options.body !== null) {
      requestOptions.headers["Content-Type"] = "application/json";
      requestOptions.body = JSON.stringify(options.body);
    }

    const response = await fetch(path, requestOptions);
    const rawText = await response.text();
    let payload = null;

    if (rawText) {
      try {
        payload = JSON.parse(rawText);
      } catch (_) {
        payload = null;
      }
    }

    if (!response.ok) {
      throw normalizeErrorPayload(response.status, payload, rawText);
    }

    if (!payload) return null;
    if (payload.success === false) {
      throw normalizeErrorPayload(response.status, payload, rawText);
    }
    return payload.data;
  }

  function refreshHeader() {
    const profileChip = $("profileChip");

    if (!state.me) {
      profileChip.textContent = "내 정보: -";
      return;
    }

    const yearLabel = state.me.birthYear ? `${String(state.me.birthYear).slice(-2)}년생` : "-년생";
    profileChip.textContent = `${state.me.nickname || state.me.name} | ${majorLabel(state.me.major)} | ${yearLabel}`;
  }

  function showAuthRequiredModal() {
    $("authRequiredModal").classList.add("open");
  }

  function showVerificationRequiredModal() {
    $("verificationRequiredModal").classList.add("open");
  }

  function unlockPage() {
    document.body.classList.remove("gate-pending");
  }

  function isFullyVerifiedUser(user) {
    return !!(user && user.emailVerified && user.studentCardVerified);
  }

  function renderRoomList() {
    const roomList = $("roomList");

    if (!state.me) {
      roomList.innerHTML = `<div class="empty">로그인 후 쪽지방 목록을 볼 수 있습니다.</div>`;
      return;
    }

    if (!state.rooms.length) {
      roomList.innerHTML = `<div class="empty">아직 생성된 쪽지방이 없습니다.</div>`;
      return;
    }

    roomList.innerHTML = state.rooms.map((room) => {
      const preview = room.lastMessageContent ? escapeHtml(room.lastMessageContent) : "대화 시작 전";
      const roomName = escapeHtml(room.otherUserName || "알 수 없음");
      const latestAt = room.lastMessageAt || room.updatedAt;
      const timeText = latestAt ? formatDateTime(latestAt) : "-";
      return `
        <a class="room-link" href="/chat-room.html?roomId=${room.roomId}">
          <article class="room-item">
            <div class="room-head">
              <p class="room-name">${roomName}</p>
              <span class="room-time">${timeText}</span>
            </div>
            <div class="room-meta">
              <span class="room-pill">${room.lastMessageId ? "대화중" : "새 쪽지"}</span>
            </div>
            <p class="room-preview">${preview}</p>
          </article>
        </a>
      `;
    }).join("");
  }

  async function loadMe() {
    try {
      const me = await api("/api/v1/users/me");
      state.me = me;
      refreshHeader();
      return { ok: true, error: null };
    } catch (error) {
      state.me = null;
      state.rooms = [];
      refreshHeader();
      renderRoomList();
      return { ok: false, error };
    }
  }

  async function loadRooms() {
    if (!state.me) {
      state.rooms = [];
      renderRoomList();
      return;
    }

    try {
      const data = await api("/api/v1/chats/rooms?page=0&size=50");
      state.rooms = (data.rooms || []).filter((room) => room.status !== "CLOSED");
      renderRoomList();
    } catch (error) {
      state.rooms = [];
      renderRoomList();
      alert(`채팅방 목록 조회 실패: ${error.message}`);
    }
  }

  function startPolling() {
    stopPolling();
    if (!state.me) {
      return;
    }
    state.pollingId = setTimeout(async () => {
      state.pollingId = null;
      await loadRooms();
      startPolling();
    }, POLLING_INTERVAL_MS);
  }

  function stopPolling() {
    if (state.pollingId) {
      clearTimeout(state.pollingId);
      state.pollingId = null;
    }
  }

  async function bootstrap() {
    const params = new URLSearchParams(window.location.search);
    const postIdRaw = params.get("postId");
    if (postIdRaw) {
      window.location.assign(`/chat-room.html?postId=${encodeURIComponent(postIdRaw)}`);
      return;
    }

    refreshHeader();
    renderRoomList();

    const meResult = await loadMe();
    if (!meResult.ok) {
      showAuthRequiredModal();
      return;
    }

    if (!isFullyVerifiedUser(state.me)) {
      showVerificationRequiredModal();
      return;
    }

    unlockPage();
    await loadRooms();
    startPolling();
  }

  $("goHomeFromAuthModalBtn").addEventListener("click", () => window.location.assign("/"));
  $("goAccountFromVerificationModalBtn").addEventListener("click", () => window.location.assign("/account.html"));
  $("goHomeFromVerificationModalBtn").addEventListener("click", () => window.location.assign("/"));
  $("refreshRoomBtn").addEventListener("click", loadRooms);
  window.addEventListener("beforeunload", stopPolling);

  bootstrap();
</script>
</body>
</html>
